name = "hero-watchdog"
main = "src/index.js"
compatibility_date = "2026-10-01"
# No public URL: the Worker only runs on its cron triggers.
workers_dev = false
preview_urls = false

# The daily render (hero.yml) has no schedule of its own: these checks are what
# start it. The first one (12:30 UTC, 8:30 AM EDT / 7:30 AM EST) starts the day's
# render. The later ones see current loops and do nothing, or retry a render that
# failed (a NOAA data gap, for example).
# The 15:15 and 18:15 checks also start the monthly upgrade (deps.yml) if it has not
# run yet this month.
[triggers]
crons = ["30 12 * * *", "15 15 * * *", "15 18 * * *"]

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "noaa-east-gifs-for-blog"

[observability]
enabled = true
