name = "hero-watchdog"
main = "src/index.js"
compatibility_date = "2026-10-01"
# No public URL: the Worker only runs on its cron triggers.
workers_dev = false
preview_urls = false

# GitHub's schedule is 12:30 UTC and a render takes about 10 minutes. These checks
# come after it, so on a day GitHub's schedule works they see current loops and do
# nothing. Later checks retry a render that failed (a NOAA data gap, for example).
# The 15:15 and 18:15 checks also start the monthly upgrade (deps.yml) if it has not
# run yet this month.
[triggers]
crons = ["15 13 * * *", "15 15 * * *", "15 18 * * *"]

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "noaa-east-gifs-for-blog"

[observability]
enabled = true
